name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        ghc: [ghc9103, ghc9124, ghc9141]
    name: Build and test on ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: tweag-ormolu
          authToken: '${{ secrets.CACHIX_TWEAG_ORMOLU_AUTH_TOKEN }}'
      - name: Build and run tests
        run: |
          nix build -L --keep-going .#${{ matrix.ghc }}.ci
  lint:
    needs: ci
    name: Formatting and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Format via Ormolu
        run: |
          nix run .#format
          git diff --exit-code --color=always
      - name: pre-commit-check
        run: |
          nix build -L .#pre-commit-check
  live:
    needs: lint
    name: Build and deploy Ormolu Live
    runs-on: ubuntu-latest
    # The Netlify preview deploy posts a comment on the pull request and sets
    # a commit status, which requires write access to the GITHUB_TOKEN. The
    # default token is read-only.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.ghc-wasm/.cabal/packages
            ~/.ghc-wasm/.cabal/store
            ormolu-live/dist-newstyle
          key: wasm-${{ hashFiles('ormolu-live/cabal.project', 'ormolu-live/*.cabal', 'ormolu.cabal', 'ormolu-live/package-lock.json') }}
          restore-keys: |
            wasm-
      - name: Build Ormolu Live
        env:
          # On pull_request builds the checked-out HEAD is an ephemeral merge
          # commit, so pass the real PR head SHA for the commit shown in the UI.
          COMMIT_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd ormolu-live
          nix develop .#ormoluLive -c sh -c '
            set -e
            npm ci
            # Only refresh the Hackage index if it is not already cached; the
            # index-state is pinned in cabal.project, so a stale-but-present
            # index is fine.
            if ! ls ~/.ghc-wasm/.cabal/packages/*/01-index.tar >/dev/null 2>&1; then
              wasm32-wasi-cabal update
            fi
            ./build.sh prod
          '
      - name: Deploy to Netlify, preview
        if: env.NETLIFY_AUTH_TOKEN != ''
        uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: ./ormolu-live/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alias: ${{ github.event.pull_request.head.sha || github.sha }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          enable-commit-status: true
      - name: Deploy to Netlify, production
        if: env.NETLIFY_AUTH_TOKEN != '' && github.ref == 'refs/heads/master'
        run: |
          nix run --inputs-from . nixpkgs#netlify-cli -- \
            deploy --prod -d ./ormolu-live/dist

  # prevent stack.yaml from becoming outdated
  stack:
    name: Build and test via Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2.12.1
        with:
          enable-stack: true
          stack-no-global: true
      - uses: actions/cache@v6
        with:
          path: ~/.stack
          key: stack-${{ hashFiles('stack.yaml', 'ormolu.cabal') }}
      - name: Build
        run: stack build
      - name: Test
        run: stack test
